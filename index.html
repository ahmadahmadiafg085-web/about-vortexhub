<script type="module">
"use strict";

const VORTEX_WEB_API = Object.freeze({
    DOM: document,
    FETCH: globalThis.fetch?.bind(globalThis),
    URL: globalThis.URL,
    URLSearchParams: globalThis.URLSearchParams,
    AbortController: globalThis.AbortController,
    Promise: globalThis.Promise,
    Crypto: globalThis.crypto,
    TextEncoder: globalThis.TextEncoder,
    Performance: globalThis.performance,
    Storage: globalThis.sessionStorage,
    Cache: globalThis.caches,
    Worker: globalThis.Worker,
    APIs: Object.freeze([
        "DOM",
        "Fetch",
        "URL",
        "URLSearchParams",
        "AbortController",
        "Promise",
        "Crypto",
        "Performance",
        "Storage",
        "Cache",
        "Worker"
    ])
});

const VORTEX_IDENTITY = Object.freeze({
    application: "VORTEX_HUB",
    subsystem: "REGISTRY",
    version: "1.0.0",
    runtime: "BROWSER",
    entry: "index.html",
    executor: "app.js"
});

const VORTEX_STATE = Object.freeze({
    CREATED: "CREATED",
    DISCOVERING: "DISCOVERING",
    LOADING: "LOADING",
    VALIDATING: "VALIDATING",
    RESOLVING: "RESOLVING",
    VERIFYING: "VERIFYING",
    RENDERING: "RENDERING",
    COMPLETED: "COMPLETED",
    PARTIAL: "PARTIAL",
    FAILED: "FAILED"
});

const VORTEX_STRATEGY = Object.freeze({
    FIRST_VALID: "FIRST_VALID",
    PARALLEL_ALL: "PARALLEL_ALL",
    SEQUENTIAL: "SEQUENTIAL",
    FAIL_CLOSED: "FAIL_CLOSED"
});

const VORTEX_CONTRACT = Object.freeze({
    required: ["id", "strategy", "execute"],
    validate(processor) {
        return Boolean(
            processor &&
            typeof processor.id === "string" &&
            typeof processor.strategy === "string" &&
            typeof processor.execute === "function"
        );
    }
});

class VortexError extends Error {
    constructor(code, message, cause = null) {
        super(message);
        this.name = "VortexError";
        this.code = code;
        this.cause = cause;
    }
}

class VortexContext {
    constructor(input) {
        this.id = crypto.randomUUID();
        this.input = input;
        this.domain = null;
        this.state = VORTEX_STATE.CREATED;
        this.request = null;
        this.response = {};
        this.evidence = [];
        this.errors = [];
        this.startedAt = performance.now();
    }

    transition(next) {
        const allowed = {
            CREATED: ["DISCOVERING", "FAILED"],
            DISCOVERING: ["LOADING", "FAILED"],
            LOADING: ["VALIDATING", "FAILED"],
            VALIDATING: ["RESOLVING", "FAILED"],
            RESOLVING: ["VERIFYING", "PARTIAL", "FAILED"],
            VERIFYING: ["RENDERING", "PARTIAL", "FAILED"],
            RENDERING: ["COMPLETED", "PARTIAL", "FAILED"],
            COMPLETED: [],
            PARTIAL: [],
            FAILED: []
        };

        if (!allowed[this.state]?.includes(next)) {
            throw new VortexError(
                "INVALID_TRANSITION",
                `${this.state} -> ${next}`
            );
        }

        this.state = next;
    }

    recordError(source, error) {
        this.errors.push({
            source,
            code: error?.code || "PROCESSOR_ERROR",
            message: error?.message || String(error)
        });
    }
}

class VortexResolver {
    constructor() {
        this.processors = new Map();
    }

    register(processor) {
        if (!VORTEX_CONTRACT.validate(processor)) {
            throw new VortexError("INVALID_PROCESSOR_CONTRACT", processor?.id);
        }

        if (this.processors.has(processor.id)) {
            throw new VortexError("DUPLICATE_PROCESSOR", processor.id);
        }

        this.processors.set(processor.id, Object.freeze(processor));
    }

    async execute(id, context) {
        const processor = this.processors.get(id);

        if (!processor) {
            throw new VortexError("PROCESSOR_NOT_FOUND", id);
        }

        if (processor.strategy === VORTEX_STRATEGY.SEQUENTIAL) {
            return await processor.execute(context);
        }

        if (processor.strategy === VORTEX_STRATEGY.FAIL_CLOSED) {
            const result = await processor.execute(context);

            if (!result || result.success !== true) {
                throw new VortexError("FAIL_CLOSED", id);
            }

            return result;
        }

        return await processor.execute(context);
    }

    async executeParallel(ids, context) {
        const results = await Promise.allSettled(
            ids.map(id => this.execute(id, context))
        );

        return results.map((result, index) => {
            if (result.status === "fulfilled") {
                return {
                    processor: ids[index],
                    success: true,
                    data: result.value
                };
            }

            context.recordError(ids[index], result.reason);

            return {
                processor: ids[index],
                success: false,
                error: result.reason
            };
        });
    }
}

const VORTEX_UTIL = Object.freeze({
    normalizeDomain(input) {
        let value = String(input || "").trim();

        if (!value) {
            throw new VortexError("EMPTY_INPUT", "Domain is required");
        }

        if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(value)) {
            value = `https://${value}`;
        }

        let url;

        try {
            url = new URL(value);
        } catch (error) {
            throw new VortexError("INVALID_URL", "Invalid domain URL", error);
        }

        if (!["http:", "https:"].includes(url.protocol)) {
            throw new VortexError("INVALID_PROTOCOL", url.protocol);
        }

        const domain = url.hostname.toLowerCase().replace(/\.$/, "");

        if (
            domain.length > 253 ||
            !domain.includes(".") ||
            domain.split(".").some(label =>
                !/^(?!-)[a-z0-9-]{1,63}(?<!-)$/.test(label)
            )
        ) {
            throw new VortexError("INVALID_DOMAIN", domain);
        }

        return {
            original: input,
            domain,
            protocol: url.protocol.replace(":", "").toUpperCase(),
            hostname: url.hostname
        };
    },

    async request(url, options = {}) {
        const controller = new AbortController();
        const timeout = setTimeout(
            () => controller.abort(),
            options.timeout || 12000
        );

        try {
            const response = await fetch(url, {
                method: "GET",
                headers: {
                    Accept: options.accept || "application/json",
                    "Cache-Control": "no-cache"
                },
                signal: controller.signal,
                mode: "cors",
                credentials: "omit",
                redirect: "follow"
            });

            if (!response.ok) {
                throw new VortexError(
                    "HTTP_ERROR",
                    `${response.status} ${response.statusText}`
                );
            }

            return {
                status: response.status,
                url: response.url,
                data: await response.json()
            };
        } finally {
            clearTimeout(timeout);
        }
    },

    async digest(value) {
        const bytes = new TextEncoder().encode(
            typeof value === "string" ? value : JSON.stringify(value)
        );

        const hash = await crypto.subtle.digest("SHA-256", bytes);

        return Array.from(new Uint8Array(hash))
            .map(byte => byte.toString(16).padStart(2, "0"))
            .join("");
    }
});

const VORTEX_RESOLVER = new VortexResolver();

VORTEX_RESOLVER.register({
    id: "identity.normalize",
    strategy: VORTEX_STRATEGY.FAIL_CLOSED,

    async execute(context) {
        context.domain = VORTEX_UTIL.normalizeDomain(context.input);

        return {
            success: true,
            identity: context.domain
        };
    }
});

VORTEX_RESOLVER.register({
    id: "dns.resolve",
    strategy: VORTEX_STRATEGY.PARALLEL_ALL,

    async execute(context) {
        const records = ["A", "AAAA", "CNAME", "MX", "NS", "TXT"];

        const results = await Promise.allSettled(
            records.map(async type => {
                const endpoint = new URL(
                    "https://cloudflare-dns.com/dns-query"
                );

                endpoint.searchParams.set("name", context.domain.domain);
                endpoint.searchParams.set("type", type);

                const response = await VORTEX_UTIL.request(
                    endpoint.href,
                    {
                        accept: "application/dns-json",
                        timeout: 12000
                    }
                );

                return {
                    type,
                    status: response.data.Status,
                    answers: response.data.Answer || [],
                    authority: response.data.Authority || []
                };
            })
        );

        return results.map((result, index) => {
            if (result.status === "fulfilled") {
                return {
                    success: true,
                    ...result.value
                };
            }

            context.recordError(`dns.${records[index]}`, result.reason);

            return {
                success: false,
                type: records[index],
                error: result.reason?.message || String(result.reason)
            };
        });
    }
});

VORTEX_RESOLVER.register({
    id: "rdap.resolve",
    strategy: VORTEX_STRATEGY.FIRST_VALID,

    async execute(context) {
        const endpoint =
            `https://rdap.org/domain/${encodeURIComponent(context.domain.domain)}`;

        const response = await VORTEX_UTIL.request(endpoint, {
            accept: "application/rdap+json, application/json",
            timeout: 15000
        });

        const data = response.data;

        return {
            success: true,
            domain: data.ldhName || context.domain.domain,
            handle: data.handle || null,
            status: data.status || [],
            registrar: data.entities?.find(entity =>
                entity.roles?.includes("registrar")
            ) || null,
            events: data.events || [],
            nameservers: data.nameservers || [],
            raw: data
        };
    }
});

VORTEX_RESOLVER.register({
    id: "result.verify",
    strategy: VORTEX_STRATEGY.FAIL_CLOSED,

    async execute(context) {
        const identityValid = Boolean(
            context.domain?.domain &&
            context.domain.domain.includes(".")
        );

        const dnsValid = Array.isArray(context.response.dns);
        const rdapCompleted = context.response.rdap?.success === true;

        if (!identityValid || !dnsValid) {
            throw new VortexError(
                "RESULT_VERIFICATION_FAILED",
                "Required result evidence is missing"
            );
        }

        const fingerprint = await VORTEX_UTIL.digest({
            requestId: context.id,
            domain: context.domain.domain,
            dns: context.response.dns,
            rdap: context.response.rdap || null
        });

        return {
            success: true,
            identityValid,
            dnsCompleted: dnsValid,
            rdapCompleted,
            fingerprint
        };
    }
});

const VORTEX_UI = {
    root: document,
    elements: {},

    find(selectors) {
        for (const selector of selectors) {
            const element = this.root.querySelector(selector);
            if (element) return element;
        }
        return null;
    },

    discover() {
        this.elements = {
            input: this.find([
                "[data-vortex-role='input']",
                "#domainInput",
                "#domain",
                "input[type='url']",
                "input[type='text']"
            ]),

            validate: this.find([
                "[data-vortex-action='validate']",
                "#validateButton",
                "#validate"
            ]),

            registry: this.find([
                "[data-vortex-action='registry']",
                "#registryButton",
                "#registry"
            ]),

            clear: this.find([
                "[data-vortex-action='clear']",
                "#clearButton",
                "#clear"
            ]),

            identity: this.find([
                "[data-vortex-output='identity']",
                "#domainIdentity"
            ]),

            dns: this.find([
                "[data-vortex-output='dns']",
                "#dnsRecords"
            ]),

            validation: this.find([
                "[data-vortex-output='validation']",
                "#dnsValidation"
            ]),

            registryOutput: this.find([
                "[data-vortex-output='registry']",
                "#domainRegistry"
            ]),

            relationship: this.find([
                "[data-vortex-output='relationship']",
                "#resultRelationship"
            ]),

            status: this.find([
                "[data-vortex-output='status']",
                "#resolutionStatus",
                "#status"
            ])
        };

        return this.elements;
    },

    write(element, value) {
        if (!element) return;

        element.textContent =
            typeof value === "string"
                ? value
                : JSON.stringify(value, null, 2);
    },

    setStatus(value) {
        this.write(this.elements.status, value);
    },

    setBusy(busy) {
        for (const button of [
            this.elements.validate,
            this.elements.registry,
            this.elements.clear
        ]) {
            if (button) button.disabled = busy;
        }

        if (this.elements.input) {
            this.elements.input.disabled = busy;
        }

        document.documentElement.dataset.vortexBusy =
            String(busy);
    },

    renderIdentity(context) {
        this.write(this.elements.identity, {
            reference: context.domain.domain,
            originalInput: context.domain.original,
            resolvedDomain: context.domain.domain,
            protocol: context.domain.protocol
        });
    },

    renderDNS(records) {
        const successful = records.filter(item => item.success);
        const answers = successful.flatMap(item => item.answers);

        this.write(this.elements.validation, {
            status: successful.length
                ? "COMPLETED"
                : "FAILED",
            checkedRecords: records.map(item => item.type),
            successfulRecords: successful.map(item => item.type),
            resolvedAddresses: answers
                .filter(item => ["A", "AAAA"].includes(item.type))
                .map(item => item.data)
        });

        this.write(this.elements.dns, {
            records,
            answers
        });
    },

    renderRDAP(result, error) {
        if (result?.success) {
            const data = result.data;

            this.write(this.elements.registryOutput, {
                status: "RECORD_FOUND",
                reference: "RDAP",
                domain: data.domain,
                handle: data.handle,
                registrar: data.registrar,
                events: data.events,
                nameservers: data.nameservers
            });

            return;
        }

        this.write(this.elements.registryOutput, {
            status: "LOOKUP_FAILED_OR_UNAVAILABLE",
            reference: "RDAP",
            error: error?.message || "No successful RDAP response",
            availabilityConfirmed: false
        });
    },

    renderRelationship(context) {
        this.write(this.elements.relationship, {
            requestReference: context.id,
            source: "VORTEX_HUB REGISTRY",
            lastOperation: "DOMAIN_RESOLUTION",
            lifecycle: context.state,
            errors: context.errors,
            elapsedMilliseconds:
                Math.round(performance.now() - context.startedAt),
            verification: context.response.verification || null
        });
    },

    renderFailure(error, context = null) {
        this.setStatus("FAILED: " + (error?.message || String(error)));

        if (context) {
            this.renderRelationship(context);
        }
    },

    clear() {
        for (const element of [
            this.elements.identity,
            this.elements.dns,
            this.elements.validation,
            this.elements.registryOutput,
            this.elements.relationship
        ]) {
            this.write(element, "");
        }

        this.setStatus("READY");
    }
};

class VortexApplication {
    constructor() {
        this.activeRequest = null;
        this.resolver = VORTEX_RESOLVER;
    }

    async execute(input, operation = "complete") {
        if (this.activeRequest) {
            this.activeRequest.abort();
        }

        const context = new VortexContext(input);
        this.activeRequest = new AbortController();

        VORTEX_UI.setBusy(true);

        try {
            context.transition(VORTEX_STATE.DISCOVERING);
            VORTEX_UI.setStatus(context.state);

            VORTEX_UI.discover();

            context.transition(VORTEX_STATE.LOADING);
            VORTEX_UI.setStatus(context.state);

            await this.resolver.execute("identity.normalize", context);

            context.transition(VORTEX_STATE.VALIDATING);
            VORTEX_UI.setStatus(context.state);

            VORTEX_UI.renderIdentity(context);

            context.transition(VORTEX_STATE.RESOLVING);
            VORTEX_UI.setStatus(context.state);

            const tasks = operation === "dns"
                ? ["dns.resolve"]
                : operation === "registry"
                    ? ["rdap.resolve"]
                    : ["dns.resolve", "rdap.resolve"];

            const results = await this.resolver.executeParallel(
                tasks,
                context
            );

            for (const result of results) {
                if (result.success) {
                    context.response[
                        result.processor === "dns.resolve" ? "dns" : "rdap"
                    ] = result.data;
                } else {
                    context.recordError(
                        result.processor,
                        result.error
                    );
                }
            }

            if (operation !== "registry") {
                VORTEX_UI.renderDNS(context.response.dns || []);
            }

            VORTEX_UI.renderRDAP(
                context.response.rdap
                    ? { success: true, data: context.response.rdap }
                    : null,
                context.errors.find(error =>
                    error.source === "rdap.resolve"
                )
            );

            context.transition(VORTEX_STATE.VERIFYING);
            VORTEX_UI.setStatus(context.state);

            try {
                context.response.verification =
                    await this.resolver.execute("result.verify", context);
            } catch (error) {
                context.recordError("result.verify", error);
            }

            context.transition(VORTEX_STATE.RENDERING);
            VORTEX_UI.setStatus(context.state);

            const hasDNS = Array.isArray(context.response.dns);
            const hasRDAP = Boolean(context.response.rdap);
            const hasVerification =
                context.response.verification?.success === true;

            const complete =
                hasVerification &&
                context.errors.length === 0 &&
                (operation === "dns"
                    ? hasDNS
                    : operation === "registry"
                        ? hasRDAP
                        : hasDNS && hasRDAP);

            context.transition(
                complete
                    ? VORTEX_STATE.COMPLETED
                    : VORTEX_STATE.PARTIAL
            );

            VORTEX_UI.renderRelationship(context);
            VORTEX_UI.setStatus(context.state);

            return {
                success: complete,
                state: context.state,
                requestId: context.id,
                response: context.response,
                errors: context.errors
            };

        } catch (error) {
            if (!["FAILED", "COMPLETED", "PARTIAL"].includes(context.state)) {
                context.transition(VORTEX_STATE.FAILED);
            }

            context.recordError("application", error);
            VORTEX_UI.renderFailure(error, context);

            return {
                success: false,
                state: context.state,
                requestId: context.id,
                errors: context.errors
            };

        } finally {
            VORTEX_UI.setBusy(false);
            this.activeRequest = null;
        }
    }

    initialize() {
        VORTEX_UI.discover();

        const {
            input,
            validate,
            registry,
            clear
        } = VORTEX_UI.elements;

        if (!input || (!validate && !registry)) {
            throw new VortexError(
                "UI_CONTRACT_INCOMPLETE",
                "Required input or action elements were not found"
            );
        }

        validate?.addEventListener("click", async () => {
            await this.execute(input.value, "complete");
        });

        registry?.addEventListener("click", async () => {
            await this.execute(input.value, "registry");
        });

        clear?.addEventListener("click", () => {
            if (this.activeRequest) {
                this.activeRequest.abort();
            }

            input.value = "";
            VORTEX_UI.clear();
        });

        input.addEventListener("keydown", event => {
            if (event.key === "Enter") {
                event.preventDefault();
                validate?.click();
            }
        });

        document.documentElement.dataset.vortexIdentity =
            VORTEX_IDENTITY.application;

        document.documentElement.dataset.vortexRuntime =
            VORTEX_IDENTITY.runtime;

        document.documentElement.dataset.vortexLifecycle =
            VORTEX_STATE.COMPLETED;

        VORTEX_UI.setStatus("UI_READY");

        return {
            success: true,
            identity: VORTEX_IDENTITY,
            runtime: VORTEX_WEB_API.APIs,
            processors: [...this.resolver.processors.keys()]
        };
    }
}

const VORTEX_HUB = new VortexApplication();

function VORTEX_BOOTSTRAP() {
    try {
        return VORTEX_HUB.initialize();
    } catch (error) {
        VORTEX_UI.renderFailure(error);

        return {
            success: false,
            error: error.message
        };
    }
}

if (document.readyState === "loading") {
    document.addEventListener(
        "DOMContentLoaded",
        VORTEX_BOOTSTRAP,
        { once: true }
    );
} else {
    VORTEX_BOOTSTRAP();
}

globalThis.VORTEX_HUB = VORTEX_HUB;
globalThis.VORTEX_RESOLVE = (input, operation) =>
    VORTEX_HUB.execute(input, operation);

</script>
