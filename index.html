<script type="module">
"use strict";

const VORTEX_HUB = (() => {
    const VERSION = "1.0.0";

    const STATE = Object.freeze({
        IDLE: "IDLE",
        DISCOVERING: "DISCOVERING",
        RESOLVING: "RESOLVING",
        VALIDATING: "VALIDATING",
        EXECUTING: "EXECUTING",
        VERIFYING: "VERIFYING",
        COMMITTING: "COMMITTING",
        COMPLETED: "COMPLETED",
        FAILED: "FAILED"
    });

    const PRIORITY = Object.freeze({
        RUNTIME: 100,
        UI: 90,
        REQUEST: 80,
        RESPONSE: 70,
        UPDATE: 60,
        OPTIONAL: 10
    });

    const context = {
        identity: "VORTEX_HUB",
        version: VERSION,
        state: STATE.IDLE,
        request: null,
        response: null,
        result: null,
        errors: [],
        modules: new Map(),
        procedures: new Map(),
        strategies: new Map(),
        adapters: new Map(),
        libraries: new Map(),
        capabilities: new Map(),
        sequence: 0
    };

    const Trait = {
        implement(target, contract) {
            for (const method of contract) {
                if (typeof target[method] !== "function") {
                    throw new TypeError(`TRAIT_CONTRACT_FAILURE:${method}`);
                }
            }
            return target;
        }
    };

    const Strategies = {
        sequential: async (steps, ctx) => {
            const results = [];
            for (const step of steps) {
                results.push(await step(ctx));
            }
            return results;
        },

        parallel: async (steps, ctx) =>
            Promise.all(steps.map(step => step(ctx))),

        fallback: async (steps, ctx) => {
            let lastError;
            for (const step of steps) {
                try {
                    return await step(ctx);
                } catch (error) {
                    lastError = error;
                }
            }
            throw lastError ?? new Error("NO_FALLBACK_STRATEGY");
        },

        priority: async (steps, ctx) => {
            const ordered = [...steps].sort(
                (a, b) => (b.priority ?? 0) - (a.priority ?? 0)
            );
            const results = [];
            for (const step of ordered) {
                if (step.enabled === false) continue;
                results.push(await step.execute(ctx));
            }
            return results;
        }
    };

    const Runtime = {
        async discover() {
            context.state = STATE.DISCOVERING;

            const capabilities = {
                browser: typeof window !== "undefined",
                document: typeof document !== "undefined",
                fetch: typeof fetch === "function",
                modules: typeof import === "function",
                cache: typeof caches !== "undefined",
                crypto: Boolean(globalThis.crypto?.subtle),
                wasm: typeof WebAssembly !== "undefined",
                serviceWorker: Boolean(navigator?.serviceWorker),
                webAssemblyCompiler: typeof WebAssembly?.compile === "function"
            };

            for (const [name, available] of Object.entries(capabilities)) {
                context.capabilities.set(name, available);
            }

            const libraries = {
                ajv: globalThis.Ajv,
                zod: globalThis.z,
                yup: globalThis.yup,
                lit: globalThis.Lit,
                react: globalThis.React,
                vue: globalThis.Vue,
                alpine: globalThis.Alpine,
                lodash: globalThis._
            };

            for (const [name, library] of Object.entries(libraries)) {
                context.libraries.set(name, {
                    available: Boolean(library),
                    reference: library ?? null
                });
            }

            context.adapters.set("browser", {
                runtime: "Browser",
                compiler: "JavaScript Engine",
                toolchain: "Browser Native APIs"
            });

            return capabilities;
        },

        registerModule(id, module) {
            if (!id || !module || typeof module !== "object") {
                throw new TypeError("INVALID_MODULE_DEFINITION");
            }

            context.modules.set(id, Object.freeze({
                id,
                ...module
            }));
        },

        registerProcedure(id, procedure) {
            Trait.implement(procedure, ["execute"]);
            context.procedures.set(id, procedure);
        },

        registerStrategy(id, strategy) {
            if (typeof strategy !== "function") {
                throw new TypeError("INVALID_STRATEGY");
            }
            context.strategies.set(id, strategy);
        },

        async loadModule(id, source) {
            if (context.modules.has(id)) {
                return context.modules.get(id);
            }

            if (typeof source !== "string" || !source.trim()) {
                throw new TypeError("INVALID_MODULE_SOURCE");
            }

            const url = new URL(source, document.baseURI);

            if (url.origin !== location.origin) {
                throw new Error("UNTRUSTED_MODULE_ORIGIN");
            }

            const loaded = await import(url.href);

            if (!loaded || typeof loaded !== "object") {
                throw new Error("MODULE_LOAD_FAILED");
            }

            this.registerModule(id, loaded);
            return loaded;
        }
    };

    const Resolver = {
        async resolve(request) {
            context.state = STATE.RESOLVING;

            const selected = [];

            for (const [id, procedure] of context.procedures) {
                if (
                    typeof procedure.matches !== "function" ||
                    procedure.matches(request, context)
                ) {
                    selected.push({ id, procedure });
                }
            }

            selected.sort(
                (a, b) =>
                    (b.procedure.priority ?? 0) -
                    (a.procedure.priority ?? 0)
            );

            if (!selected.length) {
                throw new Error("NO_COMPATIBLE_PROCEDURE");
            }

            return selected;
        },

        async resolveDependencies(moduleDefinition) {
            const dependencies = moduleDefinition.dependencies ?? [];
            const resolved = [];

            for (const dependency of dependencies) {
                const module = context.modules.get(dependency);

                if (!module) {
                    throw new Error(`UNRESOLVED_DEPENDENCY:${dependency}`);
                }

                resolved.push(module);
            }

            return resolved;
        }
    };

    const Validator = {
        async validateRequest(request) {
            context.state = STATE.VALIDATING;

            if (!request || typeof request !== "object") {
                throw new TypeError("INVALID_REQUEST");
            }

            if (typeof request.action !== "string" || !request.action) {
                throw new TypeError("REQUEST_ACTION_REQUIRED");
            }

            if (
                request.payload !== undefined &&
                (typeof request.payload !== "object" ||
                    request.payload === null)
            ) {
                throw new TypeError("INVALID_REQUEST_PAYLOAD");
            }

            return true;
        },

        async validateResponse(response) {
            if (!response || typeof response !== "object") {
                throw new TypeError("INVALID_RESPONSE");
            }

            if (response.ok !== true) {
                throw new Error("RESPONSE_NOT_SUCCESSFUL");
            }

            return true;
        }
    };

    const Executor = {
        async execute(procedures, request) {
            context.state = STATE.EXECUTING;

            const outputs = [];

            for (const entry of procedures) {
                const output = await entry.procedure.execute({
                    request,
                    context,
                    runtime: Runtime,
                    resolver: Resolver,
                    validator: Validator
                });

                if (output === undefined) {
                    throw new Error(`EMPTY_PROCEDURE_RESULT:${entry.id}`);
                }

                outputs.push({
                    procedure: entry.id,
                    output
                });
            }

            return outputs;
        }
    };

    const Verifier = {
        async verify(result) {
            context.state = STATE.VERIFYING;

            if (!Array.isArray(result) || result.length === 0) {
                throw new Error("EMPTY_EXECUTION_RESULT");
            }

            for (const item of result) {
                if (!item.procedure || item.output === undefined) {
                    throw new Error("RESULT_INTEGRITY_FAILURE");
                }
            }

            return true;
        }
    };

    const Renderer = {
        update(result) {
            if (!document?.body) {
                throw new Error("DOCUMENT_NOT_AVAILABLE");
            }

            const outputs = document.querySelectorAll(
                "[data-vortex-output]"
            );

            const serialized = JSON.stringify(result, null, 2);

            for (const element of outputs) {
                element.textContent = serialized;
            }

            const status = document.querySelector(
                "[data-vortex-status]"
            );

            if (status) {
                status.textContent = STATE.COMPLETED;
            }

            document.dispatchEvent(
                new CustomEvent("vortex:completed", {
                    detail: {
                        identity: context.identity,
                        result
                    }
                })
            );
        },

        fail(error) {
            const status = document.querySelector(
                "[data-vortex-status]"
            );

            if (status) {
                status.textContent = STATE.FAILED;
            }

            document.dispatchEvent(
                new CustomEvent("vortex:failed", {
                    detail: {
                        identity: context.identity,
                        error: String(error)
                    }
                })
            );
        }
    };

    const Pipeline = {
        async run(request) {
            context.sequence++;
            context.errors = [];
            context.request = request;
            context.response = null;
            context.result = null;

            try {
                await Runtime.discover();
                await Validator.validateRequest(request);

                const procedures = await Resolver.resolve(request);
                const result = await Executor.execute(
                    procedures,
                    request
                );

                await Verifier.verify(result);

                context.state = STATE.COMMITTING;
                context.result = result;
                context.response = {
                    ok: true,
                    sequence: context.sequence,
                    result
                };

                Renderer.update(result);
                context.state = STATE.COMPLETED;

                return context.response;
            } catch (error) {
                context.errors.push(error);
                context.state = STATE.FAILED;
                Renderer.fail(error);
                throw error;
            }
        }
    };

    const Network = {
        async request(url, options = {}) {
            if (typeof fetch !== "function") {
                throw new Error("FETCH_UNAVAILABLE");
            }

            const response = await fetch(url, {
                method: options.method ?? "GET",
                headers: {
                    "Accept": "application/json",
                    ...(options.headers ?? {})
                },
                body: options.body,
                cache: "no-store",
                credentials: "same-origin",
                signal: options.signal
            });

            const contentType =
                response.headers.get("content-type") ?? "";

            if (!response.ok) {
                throw new Error(
                    `HTTP_REQUEST_FAILED:${response.status}`
                );
            }

            let data;

            if (contentType.includes("application/json")) {
                data = await response.json();
            } else {
                data = await response.text();
            }

            const result = {
                ok: true,
                status: response.status,
                url: response.url,
                data
            };

            await Validator.validateResponse(result);
            return result;
        }
    };

    Runtime.registerStrategy("sequential", Strategies.sequential);
    Runtime.registerStrategy("parallel", Strategies.parallel);
    Runtime.registerStrategy("fallback", Strategies.fallback);
    Runtime.registerStrategy("priority", Strategies.priority);

    Runtime.registerProcedure("request", {
        priority: PRIORITY.REQUEST,

        matches(request) {
            return request.action === "request";
        },

        async execute({ request }) {
            return Network.request(
                request.payload.url,
                request.payload.options ?? {}
            );
        }
    });

    Runtime.registerProcedure("resolve", {
        priority: PRIORITY.RUNTIME,

        matches(request) {
            return request.action === "resolve";
        },

        async execute({ request }) {
            const source = request.payload.source;

            if (!source) {
                throw new Error("MODULE_SOURCE_REQUIRED");
            }

            return Runtime.loadModule(
                request.payload.id,
                source
            );
        }
    });

    Runtime.registerProcedure("custom", {
        priority: PRIORITY.OPTIONAL,

        matches(request) {
            return request.action === "custom";
        },

        async execute({ request }) {
            const handler = request.payload.handler;

            if (typeof handler !== "function") {
                throw new Error("CUSTOM_HANDLER_REQUIRED");
            }

            return handler(request.payload.input, context);
        }
    });

    return Object.freeze({
        identity: context.identity,
        version: VERSION,
        state: () => context.state,
        context,
        Runtime,
        Resolver,
        Validator,
        Executor,
        Verifier,
        Renderer,
        Network,
        Pipeline,
        Trait,
        Strategies,

        registerProcedure(id, procedure) {
            Runtime.registerProcedure(id, procedure);
        },

        registerModule(id, module) {
            Runtime.registerModule(id, module);
        },

        registerStrategy(id, strategy) {
            Runtime.registerStrategy(id, strategy);
        },

        execute(request) {
            return Pipeline.run(request);
        }
    });
})();

globalThis.VORTEX_HUB = VORTEX_HUB;

const bootstrap = async () => {
    await VORTEX_HUB.Runtime.discover();

    document.dispatchEvent(
        new CustomEvent("vortex:ready", {
            detail: {
                identity: VORTEX_HUB.identity,
                version: VORTEX_HUB.version,
                capabilities: Object.fromEntries(
                    VORTEX_HUB.context.capabilities
                )
            }
        })
    );

    document.addEventListener("click", async event => {
        const button = event.target.closest(
            "[data-vortex-action]"
        );

        if (!button) return;

        const action = button.dataset.vortexAction;
        const inputSelector = button.dataset.vortexInput;
        const input = inputSelector
            ? document.querySelector(inputSelector)
            : null;

        const output = document.querySelector(
            "[data-vortex-output]"
        );

        try {
            button.disabled = true;

            const response = await VORTEX_HUB.execute({
                action,
                payload: {
                    value: input?.value ?? "",
                    url: button.dataset.vortexUrl ?? "",
                    source: button.dataset.vortexSource ?? "",
                    id: button.dataset.vortexModule ?? "",
                    options: {
                        method: button.dataset.vortexMethod ?? "GET"
                    }
                }
            });

            if (output) {
                output.textContent = JSON.stringify(
                    response,
                    null,
                    2
                );
            }
        } catch (error) {
            if (output) {
                output.textContent = JSON.stringify({
                    ok: false,
                    error: String(error)
                }, null, 2);
            }
        } finally {
            button.disabled = false;
        }
    });

    document.dispatchEvent(
        new CustomEvent("vortex:ui-ready", {
            detail: {
                identity: VORTEX_HUB.identity,
                state: VORTEX_HUB.state()
            }
        })
    );
};

if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bootstrap, {
        once: true
    });
} else {
    await bootstrap();
}
</script>
